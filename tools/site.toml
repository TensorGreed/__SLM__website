# Settings for tools/site.py. Per-page facts (title, description, dates) come
# from the pages themselves; this file only holds site-wide values.

base_url = "https://brewslm.com/"
site_name = "BrewSLM"

# Image used for og:image / twitter:image when a page has none and no raster
# image of its own. Social cards (PNG) arrive with T6.
default_image = "assets/brewslm-logo.svg"
default_image_alt = "BrewSLM logo"

[feed]
path = "feed.xml"
title = "BrewSLM engineering blog"
subtitle = "Engineering notes on small language model fine-tuning infrastructure."
author = "TensorGreed"
author_uri = "https://github.com/TensorGreed"
# Blog posts are the top-level files matching this glob.
posts = "blog-*.html"
index = "blog.html"

[sitemap]
path = "sitemap.xml"
# Pages kept out of the sitemap (404 is always excluded).
exclude = []

[notfound]
path = "404.html"
# Page whose header and footer the 404 page copies.
chrome_from = "faqs.html"

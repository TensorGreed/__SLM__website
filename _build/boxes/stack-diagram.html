<!--
Shared diagram: the BrewSLM stack. Pages insert it with a box:stack-diagram marker.
Sources, PUBLIC BrewSLM main (580e616, rechecked 2026-11-13):
  frontend/vite.config.ts  dev server port 5173, proxies /api (ws: true) to the backend
  backend/app/config.py  TRAINING_BACKEND "external" (default) | "simulate"; ALLOW_SIMULATED_TRAINING; REDIS_URL,
    CELERY_BROKER_URL; TRAINING_EXTERNAL_CMD runs scripts/train.py
  backend/app/services/training_runtime_service.py  builtin.external_celery: celery_app.send_task
  backend/app/worker.py  run_training_job: runs train.py as a subprocess, publishes log/metric events on Redis
    channel log:experiment:<id>; backend/app/api/training.py relays that channel over a WebSocket
  backend/app/services/training_process_service.py  train.py is a subprocess of the Celery worker
  README.md  Redis and a Celery worker are required for queued training
  CLAUDE.md (Jobs framework)  background Jobs run in the API process
The SVG is maintained by hand (a one-off script laid it out; it is not kept): keep the classes, no colours.
-->

  <figcaption>With the default <code>TRAINING_BACKEND=external</code>, training needs Redis and a running Celery worker; with Redis up but no worker, the task waits in Redis and the run, though the UI shows it as running, never starts. Background Jobs such as Generate and the automatic lift check run inside the API process instead. <code>TRAINING_BACKEND=simulate</code> (with <code>ALLOW_SIMULATED_TRAINING=true</code>) fakes a run for demos, with no worker and no GPU.</figcaption>

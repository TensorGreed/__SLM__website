  <figcaption>With the default <code>TRAINING_BACKEND=external</code>, training needs Redis and a running Celery worker; with Redis up but no worker, a run sits in the queue and never starts. Background Jobs such as Generate and the automatic lift check run inside the API process instead. <code>TRAINING_BACKEND=simulate</code> (with <code>ALLOW_SIMULATED_TRAINING=true</code>) fakes a run for demos, with no worker and no GPU.</figcaption>

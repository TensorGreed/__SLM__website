<!--
Shared diagram: which tokens carry the loss. Pages insert it with a box:loss-mask-strip marker.
Sources, PUBLIC BrewSLM main (origin/main 27b058a), backend/scripts/train.py:
  _encode_causal_lm_example  tokens before the answer get label -100; answer tokens and an appended EOS keep their
    ids; a row whose answer is truncated away keeps no trained token and is dropped
  _encode_multi_turn_example / _assistant_char_spans  every assistant turn (with its end-of-turn marker) trains,
    system and user turns are -100
  the padding collator  pad labels are -100
  _normalize_requested_backend  trainer_backend "auto" -> hf_trainer (this path)
The token row is real: BrewSLM's _encode_causal_lm_example run on CPU (2026-11-13) with the SmolLM2-135M-Instruct
tokenizer on the ChatML text of {"question": "Capital of France?", "answer": "Paris."}. Two pad tokens added.
Generated by a script (gen_svg.py in the lane-4 scratchpad); hand edits are fine, keep classes, no colours.
-->

  <figcaption>One row in SmolLM2's chat format (ChatML); other formats mask the same way. Only the answer and the end-of-turn token after it carry loss, so the model learns to answer and to stop, not to write prompts. In a multi-turn row every assistant turn trains and every system and user turn is masked. A row with no answer field (plain text) trains on every token. A row whose answer is cut off by <code>max_seq_length</code> has nothing left to learn and is dropped. Classification projects train a classification head instead, so there is no token mask.</figcaption>

  <figcaption>Imported rows count as accepted the moment they land, so the import preview is their only review. Generated rows wait in the review queue until you accept them; rejected rows stay on disk, set aside. After a real training run BrewSLM scores the base and the fine-tuned model on up to 100 of the same test rows. The answer key (practice and final) is a separate, evaluation-only set: it is never split or trained on, and accepting a generated row adds it to training, not to the answer key.</figcaption>

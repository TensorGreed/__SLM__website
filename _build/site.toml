# Settings for _build/site.py. Per-page facts (title, description, dates) come
# from the pages themselves; this file holds site-wide values and, at the end,
# the per-page head overrides.

base_url = "https://brewslm.com/"
site_name = "BrewSLM"

# Image used for og:image / twitter:image when a page has none and no raster
# override. Social cards (PNG) arrive with T6.
default_image = "assets/brewslm-logo.svg"
default_image_alt = "BrewSLM logo"
robots = "index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1"

[feed]
path = "feed.xml"
title = "BrewSLM engineering blog"
subtitle = "Engineering notes on small language model fine-tuning infrastructure."
author = "TensorGreed"
author_uri = "https://github.com/TensorGreed"
# Blog posts are the top-level files matching this glob.
posts = "blog-*.html"
index = "blog.html"

[sitemap]
path = "sitemap.xml"
# Pages kept out of the sitemap (404 is always excluded).
exclude = []

[notfound]
path = "404.html"
# Page whose header and footer the 404 page copies.
chrome_from = "faqs.html"

[org]
# Publisher of the site and the author of posts and lessons (JSON-LD).
name = "TensorGreed"
logo = "assets/brewslm-logo.svg"
same_as = ["https://github.com/TensorGreed", "https://huggingface.co/TensorGreed"]

[academy]
# The academy Course carries offers (free) and a CourseInstance whose
# courseWorkload is the sum of the read times the course lessons show. The old
# hand-written teaches list was not on the page, so it is not carried over.
name = "BrewSLM Academy"
# Track folders that are Courses, in syllabus order. Other academy folders
# (tutorials/) are collections of tutorials.
course_tracks = ["foundations", "sft-fundamentals", "hands-on", "with-brewslm", "advanced"]

[faq]
# Page whose <details> Q&As become the FAQPage JSON-LD.
path = "faqs.html"

# ── Per-page head overrides ───────────────────────────────────────────────
# Only where a page's social copy differs from its <title> / description or
# uses its own image. Delete an entry to fall back to the derived value.
# Posts: date_modified = the date of the post's last real update (JSON-LD
# dateModified; defaults to the visible publish date). Never a guess.


# Check-only: fails when `python3 tools/site.py build` would change a file, an
# internal link is broken, a page lacks a title/description, or a table can
# overflow on phones. It never commits or deploys; Pages still deploys from
# the branch.
name: site check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # sitemap lastmod comes from each page's git history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/site.py check

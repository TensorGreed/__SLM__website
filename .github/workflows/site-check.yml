# Check-only: fails when `python3 _build/site.py build` would change a file, an
# internal link is broken, a page lacks a title/description, or a table can
# overflow on phones. It never commits or deploys; Pages still deploys from
# the branch.
name: site check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0 # sitemap lastmod comes from each page's git history
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python3 _build/site.py check
